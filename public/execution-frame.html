<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Repeat 执行提示</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
        .frame {
            position: fixed; inset: 0;
            border: 2px solid #3988ff;
            box-shadow:
                inset 0 0 8px 2px rgba(57, 136, 255, .68),
                inset 0 0 24px 4px rgba(57, 136, 255, .3),
                inset 0 0 56px 8px rgba(57, 136, 255, .12);
            pointer-events: none;
        }
        .badge {
            position: fixed; top: 48px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 8px; padding: 8px 16px;
            border-radius: 999px; background: #2662dc; color: white;
            font: 600 13px/1.2 "Microsoft YaHei UI", "Segoe UI", sans-serif;
            white-space: nowrap; pointer-events: none;
        }
        .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: white; }
    </style>
</head>
<body><div class="frame" aria-hidden="true"></div><div class="badge">操作中 · Esc 取消</div></body>
</html>
