<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Repeat 最小事件接收器（M0-03 / M1 验证用）</title>
        <style>
            body {
                font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif;
                margin: 0;
                display: flex;
                height: 100vh;
                flex-direction: column;
            }
            #toolbar {
                display: flex;
                gap: 8px;
                align-items: center;
                padding: 8px 12px;
                border-bottom: 1px solid #ccc;
                flex-wrap: wrap;
            }
            #toolbar button,
            #toolbar label,
            #toolbar input {
                font: inherit;
            }
            #status {
                color: #666;
                min-width: 12em;
            }
            #main {
                flex: 1;
                display: flex;
                min-height: 0;
            }
            #stage {
                flex: 1;
                position: relative;
                overflow: hidden;
                background: #fafafa;
            }
            #stage.rest {
                background: #eef6ee;
            }
            #stage .hint {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #999;
                pointer-events: none;
                font-size: 18px;
            }
            #cursor {
                position: absolute;
                width: 14px;
                height: 14px;
                margin: -7px 0 0 -7px;
                border: 2px solid #1677ff;
                border-radius: 50%;
                pointer-events: none;
                display: none;
            }
            #keys {
                position: absolute;
                bottom: 8px;
                left: 8px;
                display: flex;
                gap: 4px;
                flex-wrap: wrap;
                max-width: 60%;
                pointer-events: none;
            }
            #keys span {
                background: #1677ff;
                color: #fff;
                border-radius: 4px;
                padding: 1px 6px;
                font-size: 12px;
            }
            #log {
                width: 340px;
                border-left: 1px solid #ccc;
                overflow: auto;
                font: 12px/1.45 Consolas, monospace;
            }
            #log table {
                border-collapse: collapse;
                width: 100%;
            }
            #log td,
            #log th {
                border-bottom: 1px solid #eee;
                padding: 1px 4px;
                text-align: left;
                white-space: nowrap;
            }
            #log tr.down td {
                background: #fff7e6;
            }
        </style>
    </head>
    <body>
        <!-- Repeat 最小事件接收器：验证材料，不是产品界面。记录到达顺序与 performance.now() 时间戳，供与引擎导出数据交叉核对。 -->
        <div id="toolbar">
            <span><b>最小事件接收器</b>（验证用，非产品）</span>
            <label><input type="checkbox" id="record-move" /> 记录移动事件</label>
            <button id="btn-download">导出 JSON</button>
            <button id="btn-copy">复制 JSON</button>
            <button id="btn-clear">清空</button>
            <span id="status">等待事件…</span>
        </div>
        <div id="main">
            <div id="stage">
                <div class="hint">点击此区域并操作键鼠 / 滚轮，右侧按到达顺序记录</div>
                <div id="cursor"></div>
                <div id="keys"></div>
            </div>
            <div id="log">
                <table>
                    <thead>
                        <tr><th>#</th><th>t (ms)</th><th>事件</th><th>参数</th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </div>
        <script>
            "use strict";
            const t0 = performance.now();
            const events = [];
            const rows = document.getElementById("rows");
            const stage = document.getElementById("stage");
            const cursor = document.getElementById("cursor");
            const keys = document.getElementById("keys");
            const status = document.getElementById("status");
            const recordMove = document.getElementById("record-move");
            const pressedKeys = new Set();

            function record(type, detail, isDown) {
                const e = { seq: events.length + 1, tMs: Math.round(performance.now() - t0), type, ...detail };
                events.push(e);
                const tr = document.createElement("tr");
                if (isDown) tr.className = "down";
                tr.innerHTML = `<td>${e.seq}</td><td>${e.tMs}</td><td>${type}</td><td>${detail.short || ""}</td>`;
                rows.prepend(tr);
                while (rows.children.length > 500) rows.lastChild.remove();
                status.textContent = `已记录 ${events.length} 个事件`;
            }

            function keyShort(ev) {
                let s = ev.key;
                if (ev.ctrlKey && ev.key !== "Control") s = "Ctrl+" + s;
                if (ev.altKey && ev.key !== "Alt") s = "Alt+" + s;
                if (ev.shiftKey && ev.key !== "Shift" && s === ev.key) s = "Shift+" + s;
                return s;
            }

            stage.addEventListener("keydown", (ev) => {
                ev.preventDefault();
                const d = { key: ev.key, code: ev.code, location: ev.location, repeat: ev.repeat, ctrl: ev.ctrlKey, alt: ev.altKey, shift: ev.shiftKey, short: keyShort(ev) };
                record("keydown", d, true);
                pressedKeys.add(ev.code);
                renderKeys();
            });
            stage.addEventListener("keyup", (ev) => {
                ev.preventDefault();
                const d = { key: ev.key, code: ev.code, location: ev.location, short: keyShort(ev) };
                record("keyup", d, false);
                pressedKeys.delete(ev.code);
                renderKeys();
            });
            stage.addEventListener("mousedown", (ev) => {
                ev.preventDefault();
                record("mousedown", { button: ev.button, x: ev.offsetX, y: ev.offsetY, short: `btn${ev.button} @${ev.offsetX},${ev.offsetY}` }, true);
            });
            stage.addEventListener("mouseup", (ev) => {
                ev.preventDefault();
                record("mouseup", { button: ev.button, x: ev.offsetX, y: ev.offsetY, short: `btn${ev.button} @${ev.offsetX},${ev.offsetY}` }, false);
            });
            stage.addEventListener("wheel", (ev) => {
                ev.preventDefault();
                record("wheel", { deltaX: ev.deltaX, deltaY: ev.deltaY, deltaMode: ev.deltaMode, x: ev.offsetX, y: ev.offsetY, short: `dy=${ev.deltaY} dx=${ev.deltaX}` }, ev.deltaY < 0 || ev.deltaX < 0);
            }, { passive: false });
            stage.addEventListener("mousemove", (ev) => {
                cursor.style.display = "block";
                cursor.style.left = ev.offsetX + "px";
                cursor.style.top = ev.offsetY + "px";
                if (recordMove.checked && ev.timeStamp) {
                    record("mousemove", { x: ev.offsetX, y: ev.offsetY, short: `@${ev.offsetX},${ev.offsetY}` }, false);
                }
            });
            stage.tabIndex = 0;
            stage.addEventListener("click", () => stage.focus());
            stage.classList.add("rest");

            function renderKeys() {
                keys.innerHTML = "";
                for (const code of pressedKeys) {
                    const s = document.createElement("span");
                    s.textContent = code;
                    keys.appendChild(s);
                }
            }

            function exportJson() {
                return JSON.stringify({ tool: "repeat-receiver", exportedAt: new Date().toISOString(), baseMonotonicMs: Math.round(t0), eventCount: events.length, events }, null, 2);
            }
            document.getElementById("btn-download").addEventListener("click", () => {
                const blob = new Blob([exportJson()], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `receiver-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
            });
            document.getElementById("btn-copy").addEventListener("click", async () => {
                await navigator.clipboard.writeText(exportJson());
                status.textContent = "已复制到剪贴板";
            });
            document.getElementById("btn-clear").addEventListener("click", () => {
                events.length = 0;
                rows.innerHTML = "";
                pressedKeys.clear();
                renderKeys();
                status.textContent = "已清空";
            });
        </script>
    </body>
</html>
